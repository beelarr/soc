name: Feature request
description: Propose an improvement for the Socratic Harness Builder
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas should stay aligned with the harness posture:
        opinionated about rigor, unopinionated about tech choices, and never
        inventing a practice the person did not state.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      description: Where would this live?
      options:
        - socratic
        - setup.md
        - research.md
        - interview.md
        - verify.md
        - docs / meta
        - new skill (explain why)
        - unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or friction does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Keep scope to one skill when possible.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: >
        What should this explicitly not do? (e.g. invent a practice, install
        a skill or MCP before the person says yes, bring back a CLI)
    validations:
      required: false
